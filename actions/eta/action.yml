name: Job ETA
description: Run a long command with expected finish and a live p90 warning
inputs:
  token:
    description: GitHub token with actions read permission
    required: true
  job-name:
    description: Exact unique API job display name, including matrix values
    required: true
  check-run-id:
    description: The current job.check_run_id from the workflow; missing identity makes ETA unavailable
    required: false
  command:
    description: Bash command to execute while monitoring elapsed job time
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ETA_JOB_NAME: ${{ inputs.job-name }}
        ETA_CHECK_RUN_ID: ${{ inputs.check-run-id }}
        ETA_COMMAND: ${{ inputs.command }}
        KIT_ACTION_PATH: ${{ github.action_path }}
      run: ETA_BASH="$BASH" node "$KIT_ACTION_PATH/eta.mjs"
