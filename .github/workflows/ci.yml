name: ci
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: ./actions/eta
        with:
          token: ${{ github.token }}
          job-name: test
          check-run-id: ${{ job.check_run_id }}
          command: npm run check && npm test
  scan:
    uses: ./.github/workflows/gitleaks.yml
